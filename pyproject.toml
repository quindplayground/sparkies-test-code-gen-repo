[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoke-health-api"
version = "0.1.0"
description = "Minimal HTTP health service for end-to-end smoke testing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smoke_health_api*"]
